<script>
// Tự động phát hiện và thêm class in-iframe
(function() {
  const isLocal = window.location.protocol === 'file:' || 
                  window.location.hostname === 'localhost' || 
                  window.location.hostname === '127.0.0.1' || window.location.hostname.endsWith('.vercel.app');
  let depth = 0;
  let current = window;
  while (current !== window.top && current.parent !== current) {
    depth++;
    current = current.parent;
    if (depth > 10) break;
  }
  const isInIframe = isLocal ? (depth >= 1) : (depth >= 3);

  if (isInIframe) {
    document.documentElement.classList.add('in-iframe');
    const addClass = () => { if (document.body) document.body.classList.add('in-iframe'); };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addClass);
    } else {
      addClass();
    }
  }
})();

// Sử dụng URL Web App được định nghĩa toàn cục từ trang chính
// Gán thẳng vào window (không khai báo) => miễn nhiễm lỗi "already declared"
// kể cả khi GAS nạp script này nhiều lần hoặc tồn tại file cũ khai báo trùng
window.API_URL = window.SCRIPT_URL;
window.CACHE_DURATION = 60000; // 60 giây

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message);
  return json.data;
}

function getCache(key) {
  try {
    const cached = sessionStorage.getItem('cpm_cache_' + key);
    if (!cached) return null;
    const parsed = JSON.parse(cached);
    const age = Date.now() - parsed.timestamp;
    if (age < CACHE_DURATION) {
      return parsed.data;
    }
  } catch(e) {}
  return null;
}

function setCache(key, data) {
  try {
    const obj = {
      timestamp: Date.now(),
      data: data
    };
    sessionStorage.setItem('cpm_cache_' + key, JSON.stringify(obj));
  } catch(e) {}
}

function clearCache(key) {
  try {
    sessionStorage.removeItem('cpm_cache_' + key);
  } catch(e) {}
}

window.API = {
  list: async (sheet, useCache = true) => {
    if (useCache) {
      const cached = getCache(sheet);
      if (cached) return cached;
    }
    const data = await apiPost({ action: 'list', sheet });
    if (useCache) {
      setCache(sheet, data);
    }
    return data;
  },
  
  batchList: async (sheets, useCache = true) => {
    const result = {};
    const missingSheets = [];
    
    if (useCache) {
      sheets.forEach(sheet => {
        const cached = getCache(sheet);
        if (cached) {
          result[sheet] = cached;
        } else {
          missingSheets.push(sheet);
        }
      });
    } else {
      missingSheets.push(...sheets);
    }
    
    if (missingSheets.length > 0) {
      try {
        const batchData = await apiPost({ action: 'batch_list', sheets: missingSheets });
        Object.keys(batchData).forEach(sheet => {
          result[sheet] = batchData[sheet];
          if (useCache) {
            setCache(sheet, batchData[sheet]);
          }
        });
      } catch(err) {
        console.error("Lỗi batchList, thực hiện fallback gọi tuần tự:", err);
        // Fallback: gọi từng sheet riêng lẻ nếu batch bị lỗi
        for (const sheet of missingSheets) {
          result[sheet] = await API.list(sheet, useCache);
        }
      }
    }
    
    return result;
  },

  get:    (sheet, id)        => apiPost({ action: 'get',    sheet, id }),
  
  create: async (sheet, data) => {
    const res = await apiPost({ action: 'create', sheet, data });
    clearCache(sheet);
    if (sheet === 'hopdong' || sheet === 'phuluc' || sheet === 'nghiemthu') {
      clearCache('duan');
    }
    return res;
  },
  
  update: async (sheet, id, data) => {
    const res = await apiPost({ action: 'update', sheet, id, data });
    clearCache(sheet);
    if (sheet === 'hopdong' || sheet === 'phuluc' || sheet === 'nghiemthu') {
      clearCache('duan');
    }
    return res;
  },
  
  delete: async (sheet, id) => {
    const res = await apiPost({ action: 'delete', sheet, id });
    clearCache(sheet);
    if (sheet === 'hopdong' || sheet === 'phuluc' || sheet === 'nghiemthu') {
      clearCache('duan');
    }
    return res;
  },
  
  login:  (email, password)  => apiPost({ action: 'login',  email, password }),

  loginTVGS: (identifier, password) => apiPost({ action: 'login_tvgs', identifier, password }),

  tvgsSync: () => apiPost({ action: 'tvgs_sync' }),

  tvgsCheckNow: () => apiPost({ action: 'tvgs_check_now' }),

  tvgsChangePassword: (maSoDN, oldPassword, newPassword) => apiPost({ action: 'tvgs_change_password', maSoDN, oldPassword, newPassword }),

  qtInit: (maDA) => apiPost({ action: 'qt_init', maDA }),

  qtLoad: (maQT) => apiPost({ action: 'qt_load', maQT }),

  qtDelete: (maQT) => apiPost({ action: 'qt_delete', maQT }),

  clearAllCache: () => {
    try {
      const keys = Object.keys(sessionStorage);
      keys.forEach(key => {
        if (key.indexOf('cpm_cache_') === 0) {
          sessionStorage.removeItem(key);
        }
      });
    } catch(e) {}
  }
};

// ─── SESSION TOKEN RECOVERY ─────────────────────────────────────────────────
// GAS đổi iframe origin mỗi lần chuyển trang → localStorage bị xóa.
// Giải pháp: Code.gs truyền authToken qua template, trang đích đọc và khôi phục.
if (typeof AUTH_TOKEN !== 'undefined' && AUTH_TOKEN) {
  try {
    localStorage.setItem('userProfile', decodeURIComponent(atob(AUTH_TOKEN)));
  } catch(e) {}
}

// ─── AUTH & NAVIGATION ──────────────────────────────────────────────────────
window.Auth = {
  navigateTo: (url) => {
    // Không tự điều hướng khi đang ở màn hình cấp quyền OAuth của Google
    // (sandbox chặn navigation không có thao tác người dùng -> lỗi console)
    if (window.location.href.indexOf('createOAuthDialog') >= 0) return;

    const isLocal = window.location.protocol === 'file:' ||
                    window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' || window.location.hostname.endsWith('.vercel.app');
                    
    // Trên GAS: đính kèm token session vào URL để server truyền xuống trang đích
    if (!isLocal) {
      const profileStr = localStorage.getItem('userProfile');
      if (profileStr && !url.includes('token=')) {
        const token = btoa(encodeURIComponent(profileStr));
        url += (url.includes('?') ? '&' : '?') + 'token=' + token;
      }
    }

    if (isLocal) {
      window.location.href = url;
    } else {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_top';
      if (document.body) {
        document.body.appendChild(link);
      } else {
        document.documentElement.appendChild(link);
      }
      link.click();
    }
  },
  checkAuth: (isLoginPage = false) => {
    const isLocal = window.location.protocol === 'file:' || 
                    window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || window.location.hostname.endsWith('.vercel.app');

    const profileStr = localStorage.getItem('userProfile');
    let profile = null;
    try {
      if (profileStr) profile = JSON.parse(profileStr);
    } catch(e) {
      localStorage.removeItem('userProfile');
    }

    if (isLoginPage) {
      if (profile) {
        Auth.navigateTo(isLocal ? "../index.html" : SCRIPT_URL + "?page=index");
      }
    } else {
      if (!profile) {
        const isIndexPage = window.location.pathname.endsWith('index.html') || 
                            (!window.location.pathname.includes('/pages/'));
        Auth.navigateTo(isLocal 
          ? (isIndexPage ? "pages/login.html" : "login.html") 
          : SCRIPT_URL + "?page=login");
        return null;
      }
      return profile;
    }
  },
  logout: () => {
    const isLocal = window.location.protocol === 'file:' || 
                    window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || window.location.hostname.endsWith('.vercel.app');
    localStorage.removeItem('userProfile');
    if (isLocal) {
      const isIndexPage = window.location.pathname.endsWith('index.html') || 
                          (!window.location.pathname.includes('/pages/'));
      Auth.navigateTo(isIndexPage ? "pages/login.html" : "login.html");
    } else {
      Auth.navigateTo(SCRIPT_URL + "?page=login");
    }
  }
};
</script>


  <!-- Fallback khi chạy local không có include GAS -->

    // ─── SHIM TỰ PHỤC HỒI: đảm bảo API luôn có ĐỦ phương thức ───

    if (typeof API === 'undefined') { window.API = {}; }
    (function () {
      const P = async (body) => {
        const res = await fetch(window.SCRIPT_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(body) });
        const json = await res.json();
        if (json.status === 'error') throw new Error(json.message);
        return json.data;
      };
      const M = {
        list:   (sheet) => P({ action: 'list', sheet }),
        get:    (sheet, id) => P({ action: 'get', sheet, id }),
        create: (sheet, data) => P({ action: 'create', sheet, data }),
        update: (sheet, id, data) => P({ action: 'update', sheet, id, data }),
        delete: (sheet, id) => P({ action: 'delete', sheet, id }),
        login:  (email, password) => P({ action: 'login', email, password }),
        loginTVGS: (identifier, password) => P({ action: 'login_tvgs', identifier, password }),
        tvgsSync: () => P({ action: 'tvgs_sync' }),
        tvgsCheckNow: () => P({ action: 'tvgs_check_now' }),
        tvgsChangePassword: (maSoDN, oldPassword, newPassword) => P({ action: 'tvgs_change_password', maSoDN, oldPassword, newPassword }),
        qtInit: (maDA) => P({ action: 'qt_init', maDA }),
        qtLoad: (maQT) => P({ action: 'qt_load', maQT }),
        qtDelete: (maQT) => P({ action: 'qt_delete', maQT }),
        batchList: async (sheets) => {
          const result = {};
          for (const sheet of sheets) {
            try { result[sheet] = await API.list(sheet); } catch (e) { result[sheet] = []; }
          }
          return result;
        },
        clearAllCache: () => {}
      };
      for (const k in M) { if (typeof API[k] !== 'function') API[k] = M[k]; }
    })();

    // ─── TOAST HIỆN ĐẠI: thay thế hộp thoại alert() mặc định của trình duyệt ───
    if (!window.__cpmToast) {
      window.__cpmToast = true;
      const tStyle = document.createElement('style');
      tStyle.textContent = '#cpmToastWrap{position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:10px;max-width:380px}' +
        '.cpm-toast{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(2,6,23,.18);border-left:4px solid #3b82f6;font-family:Inter,system-ui,sans-serif;font-size:.875rem;color:#0f172a;animation:cpmIn .25s ease;white-space:pre-line;word-break:break-word}' +
        '.cpm-toast.success{border-left-color:#16a34a}.cpm-toast.error{border-left-color:#dc2626}.cpm-toast.warning{border-left-color:#d97706}' +
        '.cpm-toast .ico{font-size:1.05rem;line-height:1.3}.cpm-toast .cls{margin-left:auto;border:0;background:none;color:#94a3b8;font-size:1.05rem;line-height:1;cursor:pointer;padding:0 0 0 6px}' +
        '.cpm-toast.out{opacity:0;transform:translateX(24px);transition:all .25s ease}' +
        '@keyframes cpmIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}';
      document.head.appendChild(tStyle);
      window.cpmToast = function (msg, type) {
        msg = String(msg == null ? '' : msg);
        if (!type) {
          type = /❌|⛔|lỗi|thất bại|không hợp lệ|không tìm thấy|error/i.test(msg) ? 'error'
               : /✅|thành công|đã gửi|đã lưu|đã xóa|đồng bộ xong|đã khởi tạo|đã cài/i.test(msg) ? 'success'
               : /⚠|vui lòng|chưa |hãy /i.test(msg) ? 'warning' : 'info';
        }
        const icons = { success: '✅', error: '⛔', warning: '⚠️', info: 'ℹ️' };
        let wrap = document.getElementById('cpmToastWrap');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.id = 'cpmToastWrap';
          (document.body || document.documentElement).appendChild(wrap);
        }
        const t = document.createElement('div');
        t.className = 'cpm-toast ' + type;
        const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = icons[type] || icons.info;
        const tx = document.createElement('span'); tx.textContent = msg;
        const cls = document.createElement('button'); cls.className = 'cls'; cls.innerHTML = '&times;';
        const closeFn = () => { t.classList.add('out'); setTimeout(() => t.remove(), 260); };
        cls.onclick = closeFn;
        t.appendChild(ico); t.appendChild(tx); t.appendChild(cls);
        wrap.appendChild(t);
        setTimeout(closeFn, type === 'error' ? 6000 : 4000);
      };
      if (!window.showToast) window.showToast = window.cpmToast;
      window.alert = function (msg) { window.cpmToast(msg); };
    }
</script>

  <script>
    // ─── AUTH: chỉ cho phép tài khoản TVGS ───
    let profile = null;
    try { profile = JSON.parse(localStorage.getItem('userProfile') || 'null'); } catch(e) {}

    function goLogin() {
      const isLocal = window.location.protocol === 'file:' ||
                      window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' || window.location.hostname.endsWith('.vercel.app');
      localStorage.removeItem('userProfile');
      if (isLocal) { window.location.href = 'login.html'; }
      else {
        const link = document.createElement('a');
        link.href = SCRIPT_URL + '?page=login';
        link.target = '_top';
        document.body.appendChild(link);
        link.click();
      }
    }

    if (!profile || profile.role !== 'TVGS') { goLogin(); }

    // ─── HIỂN THỊ THÔNG TIN ───
    document.getElementById('tvgsTenDN').textContent = profile.tenDN || '—';
    document.getElementById('tvgsMaSoDN').textContent = profile.maSoDN || '—';
    document.getElementById('infoChuKy').textContent = profile.chuKy || 'Chưa thiết lập';
    document.getElementById('infoHanNop').textContent = profile.hanNop ? ('Hạn nộp: ' + profile.hanNop) : '';
    const soVP = parseInt(profile.soViPham) || 0;
    const vpEl = document.getElementById('infoViPham');
    vpEl.textContent = soVP + '/3';
    vpEl.className = 'fs-5 fw-bold ' + (soVP >= 3 ? 'text-danger' : soVP > 0 ? 'text-warning' : 'text-success');
    const ttEl = document.getElementById('infoTrangThai');
    ttEl.textContent = profile.trangThai || 'Hoạt động';
    ttEl.className = 'fs-5 fw-bold ' + (/vi phạm/i.test(profile.trangThai || '') ? 'text-danger' : 'text-success');
    document.getElementById('infoBaoCaoGanNhat').textContent = profile.baoCaoGanNhat ? ('BC gần nhất: ' + profile.baoCaoGanNhat) : 'Chưa có báo cáo';

    // ─── DROPDOWN HỢP ĐỒNG ───
    const hdSelect = document.getElementById('rp-maHD');
    const hopDongs = profile.hopDongs || [];
    hdSelect.innerHTML = hopDongs.length
      ? hopDongs.map(hd => `<option value="${hd.maHD}" data-mada="${hd.maDA || ''}">${hd.maHD} — ${hd.tenHD}</option>`).join('')
      : '<option value="">(Không có hợp đồng giám sát)</option>';

    // ─── NỘP BÁO CÁO ───
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitReport');
      const msg = document.getElementById('reportMsg');
      const opt = hdSelect.selectedOptions[0];
      if (!opt || !opt.value) { msg.textContent = 'Không có hợp đồng để báo cáo'; msg.className = 'ms-3 small text-danger'; return; }

      btn.disabled = true;
      msg.textContent = 'Đang gửi...';
      msg.className = 'ms-3 small text-muted';
      try {
        await API.create('baocaotvgs', {
          maSoDN: profile.maSoDN,
          tenDN: profile.tenDN,
          maHD: opt.value,
          maDA: opt.dataset.mada || '',
          hangMuc: document.getElementById('rp-hangMuc').value.trim(),
          danhGia: document.getElementById('rp-danhGia').value,
          viPham: document.getElementById('rp-viPham').value.trim(),
          kienNghi: document.getElementById('rp-kienNghi').value.trim(),
          hinhAnh: document.getElementById('rp-hinhAnh').value.trim(),
          ghiChu: document.getElementById('rp-ghiChu').value.trim()
        });
        msg.textContent = '✅ Đã gửi báo cáo thành công!';
        msg.className = 'ms-3 small text-success';
        ['rp-hangMuc','rp-viPham','rp-kienNghi','rp-hinhAnh','rp-ghiChu'].forEach(id => document.getElementById(id).value = '');
        loadReports();
      } catch (err) {
        msg.textContent = '❌ ' + (err.message || 'Lỗi gửi báo cáo');
        msg.className = 'ms-3 small text-danger';
      } finally {
        btn.disabled = false;
      }
    });

    // ─── DANH SÁCH BÁO CÁO CỦA TÔI ───
    async function loadReports() {
      const tbody = document.getElementById('reportTableBody');
      try {
        const all = await API.list('baocaotvgs', false);
        const mine = (all || []).filter(r => String(r.maSoDN || '').trim() === String(profile.maSoDN).trim())
                                .sort((a, b) => String(b.ngay || '').localeCompare(String(a.ngay || '')));
        if (mine.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Chưa có báo cáo nào</td></tr>';
          return;
        }
        tbody.innerHTML = mine.map(r => {
          const badge = /không/i.test(r.danhGia || '') ? 'bg-danger' : /điều kiện/i.test(r.danhGia || '') ? 'bg-warning text-dark' : 'bg-success';
          return `<tr>
            <td class="fw-bold">${r.maBC || ''}</td>
            <td>${r.ngay || ''}</td>
            <td>${r.maHD || ''}</td>
            <td>${r.hangMuc || ''}</td>
            <td><span class="badge ${badge}">${r.danhGia || ''}</span></td>
            <td>${r.viPham || '—'}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Lỗi tải dữ liệu: ' + err.message + '</td></tr>';
      }
    }
    loadReports();
    document.getElementById('btnReload').addEventListener('click', loadReports);

    // ─── ĐỔI MẬT KHẨU ───
    const passModal = new bootstrap.Modal(document.getElementById('passModal'));
    document.getElementById('btnChangePass').addEventListener('click', () => passModal.show());
    document.getElementById('passForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('passMsg');
      const btn = document.getElementById('btnSavePass');
      btn.disabled = true;
      msg.textContent = 'Đang xử lý...';
      msg.className = 'small text-center mt-2 text-muted';
      try {
        await API.tvgsChangePassword(profile.maSoDN, document.getElementById('pw-old').value, document.getElementById('pw-new').value);
        msg.textContent = '✅ Đổi mật khẩu thành công!';
        msg.className = 'small text-center mt-2 text-success';
        setTimeout(() => passModal.hide(), 1200);
      } catch (err) {
        msg.textContent = '❌ ' + (err.message || 'Lỗi');
        msg.className = 'small text-center mt-2 text-danger';
      } finally {
        btn.disabled = false;
      }
    });

    // ─── ĐĂNG XUẤT ───
    document.getElementById('btnLogout').addEventListener('click', goLogin);
  </script>
</body>
</html>
