<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Đầu tư công — Xã Tân Phú</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#1d4ed8; --brand-soft:#eff6ff;
  --ok:#059669; --warn:#d97706; --bad:#dc2626; --info:#0891b2; --purple:#7c3aed;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--brand)}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px 60px}

/* ── Header ─────────────────────────────────────────── */
.topbar{background:linear-gradient(120deg,#0f2557,#1d4ed8 55%,#0891b2);color:#fff;padding:20px 0 74px}
.topbar .wrap{padding-bottom:0}
.tb-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px}
.brand .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;backdrop-filter:blur(6px)}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.brand p{margin:2px 0 0;font-size:12.5px;opacity:.82}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.26)}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:#1740b8}
.btn-o{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-o:hover{background:#f8fafc}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.stamp{font-size:12px;opacity:.8}

/* ── Filters ───────────────────────────────────────── */
.filters{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:-54px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;align-items:end}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.fld select,.fld input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--ink)}
.fld select:focus,.fld input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}

/* ── KPI ───────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-top:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.kpi .lb{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .vl{font-size:27px;font-weight:800;letter-spacing:-1px;margin:7px 0 3px;line-height:1.1}
.kpi .sb{font-size:12px;color:var(--muted)}
.kpi .ic{position:absolute;right:13px;top:13px;font-size:21px;opacity:.16}
.bar{height:6px;background:#eef2f7;border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}

/* ── Cards / grid ──────────────────────────────────── */
.grid{display:grid;gap:14px;margin-top:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g2{grid-template-columns:1.25fr 1fr}
@media(max-width:1100px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 13px}
.chart-box{position:relative;height:270px}
.chart-tall{height:330px}

/* ── Tables ────────────────────────────────────────── */
.tw{overflow:auto;border-radius:10px;border:1px solid var(--line);max-height:620px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:left;padding:10px 11px;font-size:11px;
  font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.srt{cursor:pointer;user-select:none}
thead th.srt:hover{color:var(--brand)}
tbody td{padding:10px 11px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fbff}
tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctr{text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.p-run{background:#dbeafe;color:#1e40af}.p-done{background:#d1fae5;color:#065f46}
.p-pause{background:#fef3c7;color:#92400e}.p-new{background:#f1f5f9;color:#475569}
.p-bad{background:#fee2e2;color:#991b1b}.p-ok{background:#d1fae5;color:#065f46}
.p-warn{background:#fef3c7;color:#92400e}
.mini{height:6px;background:#eef2f7;border-radius:99px;overflow:hidden;min-width:64px}
.mini>i{display:block;height:100%}
.tag{display:inline-block;background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.muted{color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* ── Alert panel ───────────────────────────────────── */
.alert-card{border-left:5px solid var(--bad)}
.alert-card.clean{border-left-color:var(--ok)}
.banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:12px}
.banner.good{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}

/* ── Drawer ────────────────────────────────────────── */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);z-index:60;display:none}
.ovl.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:61;
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dr-head h2{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.3}
.dr-body{padding:18px 22px;overflow:auto;flex:1}
.x{background:#f1f5f9;border:0;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:17px;color:var(--muted);flex:none}
.x:hover{background:#e2e8f0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:18px}
.dl div{background:#f8fafc;border-radius:10px;padding:10px 12px}
.dl dt{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dl dd{margin:4px 0 0;font-size:14px;font-weight:700}
h4.blk{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 9px}

/* ── Modal email ───────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:70;display:none;padding:24px;overflow:auto}
.modal.on{display:block}
.modal-box{background:#fff;border-radius:16px;max-width:820px;margin:0 auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:18px 20px;max-height:70vh;overflow:auto}
pre.mail{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:10px;font-size:12px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,'SF Mono',Consolas,monospace}

/* ── Misc ──────────────────────────────────────────── */
.loading{text-align:center;padding:70px 20px;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:16px 18px;margin-top:16px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
@media print{
  .topbar{background:#1d4ed8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .btn,.filters,.x{display:none!important}
  .tw{max-height:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid var(--line)}
}
@media(max-width:640px){
  .wrap{padding:0 12px 40px}
  .kpi .vl{font-size:22px}
  .brand h1{font-size:16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="tb-row">
      <div class="brand">
        <div class="logo">🏛️</div>
        <div>
          <h1>Dashboard Quản lý Đầu tư công</h1>
          <p id="subTitle">Ban Quản lý Dự án — Xã Tân Phú · Đang tải dữ liệu…</p>
        </div>
      </div>
      <div class="tb-actions">
        <span class="stamp" id="stamp"></span>
        <button class="btn btn-ghost" id="btnReload">↻ Làm mới</button>
        <button class="btn btn-ghost" id="btnCsv">⬇ Xuất CSV</button>
        <button class="btn btn-ghost" onclick="window.print()">🖨 In</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- FILTERS -->
  <div class="filters" id="filters">
    <div class="fld"><label>Năm thực hiện</label><select id="fYear"><option value="all">Tất cả</option></select></div>
    <div class="fld"><label>Loại dự án</label><select id="fType"><option value="all">Tất cả</option></select></div>
    <div class="fld"><label>Trạng thái</label><select id="fStatus"><option value="all">Tất cả</option></select></div>
    <div class="fld"><label>Cán bộ phụ trách</label><select id="fOwner"><option value="all">Tất cả</option></select></div>
    <div class="fld"><label>Tìm kiếm</label><input id="fSearch" type="search" placeholder="Mã hoặc tên dự án…"></div>
  </div>

  <div id="app">
    <div class="loading"><div class="spin"></div>Đang kết nối cơ sở dữ liệu…</div>
  </div>
</div>

<!-- DRAWER CHI TIẾT DỰ ÁN -->
<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head">
    <div>
      <h2 id="drTitle">—</h2>
      <div class="muted" style="font-size:12.5px" id="drSub"></div>
    </div>
    <button class="x" id="drClose">✕</button>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<!-- MODAL EMAIL -->
<div class="modal" id="mail">
  <div class="modal-box">
    <div class="modal-head">
      <h3>✉️ Nội dung email nhắc nhở</h3>
      <button class="x" id="mailClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab on" data-mt="txt">Bản văn bản</button>
        <button class="tab" data-mt="html">Bản HTML</button>
        <button class="tab" data-mt="prev">Xem trước</button>
      </div>
      <div id="mailTo" class="muted" style="font-size:12.5px;margin-bottom:10px"></div>
      <div id="mailPane"></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-p btn-sm" id="btnCopy">📋 Sao chép</button>
        <button class="btn btn-o btn-sm" id="btnMailto">📧 Mở ứng dụng mail</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/cpm-core.js"></script>
<script>
'use strict';
var DATA = { projects: [], staff: [], reports: [], gantt: [] };
var STATUS = [];            // computeReportStatus()
var CHARTS = {};
var SORT = { key: 'tyLeGiaiNgan', dir: -1 };
var TODAY = new Date();
var REPORT_FORM_URL = 'bao-cao-nhanh';   // dùng cho link trong email

var C = { blue:'#1d4ed8', cyan:'#0891b2', green:'#059669', amber:'#d97706', red:'#dc2626',
          purple:'#7c3aed', slate:'#64748b', pink:'#db2777', teal:'#0d9488', lime:'#65a30d' };
var PALETTE = [C.blue,C.cyan,C.green,C.amber,C.purple,C.red,C.teal,C.pink,C.lime,C.slate];

// ═══════════════════════ TẢI DỮ LIỆU ═══════════════════════
function boot(useCache){
  document.getElementById('app').innerHTML =
    '<div class="loading"><div class="spin"></div>Đang tải dữ liệu từ Google Sheets…</div>';
  CPM.loadAll(useCache !== false).then(function(d){
    DATA = d;
    STATUS = CPM.computeReportStatus(d.projects, d.reports, d.staff, TODAY, CPM.CFG.reportDeadlineDays);
    buildFilters();
    render();
    document.getElementById('subTitle').textContent =
      'Ban Quản lý Dự án — Xã Tân Phú · ' + d.projects.length + ' dự án · ' + d.reports.length + ' báo cáo hiện trường';
    document.getElementById('stamp').textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN') + ' ' + CPM.fmtDate(TODAY);
  }).catch(function(e){
    document.getElementById('app').innerHTML =
      '<div class="err"><b>Không tải được dữ liệu.</b><br>' + CPM.esc(e.message || e) +
      '<div style="margin-top:10px;font-size:12.5px">Nguyên nhân thường gặp:<ul style="margin:6px 0 0 18px">' +
      '<li>Mở file bằng <code>file://</code> — trình duyệt chặn CORS. Hãy chạy qua HTTP (Live Server / Vercel).</li>' +
      '<li>Apps Script Web App chưa deploy ở chế độ <b>Anyone</b>.</li>' +
      '<li>Mạng chậm hoặc Apps Script đang quá tải — bấm <b>Làm mới</b>.</li></ul></div>' +
      '<button class="btn btn-p btn-sm" style="margin-top:12px" onclick="boot(false)">Thử lại</button></div>';
  });
}

function buildFilters(){
  var uniq = function(arr){ return Array.from(new Set(arr.filter(Boolean))).sort(); };
  fill('fYear',   uniq(DATA.projects.map(function(p){return p.namThucHien;})));
  fill('fType',   uniq(DATA.projects.map(function(p){return p.loaiDA;})));
  fill('fStatus', uniq(DATA.projects.map(function(p){return p.trangThai;})));
  var owners = uniq([].concat(
    DATA.projects.map(function(p){return p.phuTrachKT;}),
    DATA.projects.map(function(p){return p.phuTrachKeToan;})));
  fill('fOwner', owners);
  function fill(id, vals){
    var el = document.getElementById(id);
    if (el.options.length > 1) return;
    vals.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); });
  }
}

function filtered(){
  var y=v('fYear'), t=v('fType'), s=v('fStatus'), o=v('fOwner');
  var q=CPM.norm(document.getElementById('fSearch').value);
  return STATUS.filter(function(st){
    var p=st.project;
    if(y!=='all' && String(p.namThucHien)!==y) return false;
    if(t!=='all' && p.loaiDA!==t) return false;
    if(s!=='all' && p.trangThai!==s) return false;
    if(o!=='all' && !CPM.sameName(p.phuTrachKT,o) && !CPM.sameName(p.phuTrachKeToan,o)) return false;
    if(q && CPM.norm(p.maDA+' '+p.tenDA+' '+p.moTa+' '+p.giaiDoan).indexOf(q)<0) return false;
    return true;
  });
  function v(id){ return document.getElementById(id).value; }
}

// ═══════════════════════ RENDER ═══════════════════════
function render(){
  var rows = filtered();
  document.getElementById('app').innerHTML =
    kpiHTML(rows) +
    '<div class="grid g3">' +
      card('Cơ cấu dự án theo trạng thái','Số lượng dự án đang ở mỗi trạng thái','<div class="chart-box"><canvas id="chStatus"></canvas></div>') +
      card('Cơ cấu nguồn vốn','Phân bổ theo từng nguồn vốn bố trí','<div class="chart-box"><canvas id="chSource"></canvas></div>') +
      card('Đầu tư & giải ngân theo lĩnh vực','Tổng mức đầu tư so với số đã giải ngân (tỷ đồng)','<div class="chart-box"><canvas id="chType"></canvas></div>') +
    '</div>' +
    '<div class="grid g2">' +
      card('Tỷ lệ giải ngân từng dự án','Xếp theo tỷ lệ giải ngân trên tổng mức đầu tư','<div class="chart-box chart-tall"><canvas id="chRatio"></canvas></div>') +
      card('Nhịp độ báo cáo hiện trường','Số báo cáo ngày nhận được theo thời gian','<div class="chart-box chart-tall"><canvas id="chPace"></canvas></div>') +
    '</div>' +
    alertHTML(rows) +
    tableHTML(rows) +
    staffHTML(rows);

  drawStatus(rows); drawSource(rows); drawType(rows); drawRatio(rows); drawPace(rows);
  wireTable();
}

function card(title, sub, body){
  return '<div class="card"><h3>'+title+'</h3><p class="sub">'+sub+'</p>'+body+'</div>';
}

// ── KPI ──────────────────────────────────────────────
function kpiHTML(rows){
  var ps = rows.map(function(r){return r.project;});
  var total   = ps.reduce(function(a,p){return a+p.tongMucDauTu;},0);
  var paid    = ps.reduce(function(a,p){return a+p.soGiaiNgan;},0);
  var ratio   = total? paid/total : 0;
  var running = ps.filter(function(p){return CPM.norm(p.trangThai).indexOf('dangthuchien')>=0;}).length;
  var done    = ps.filter(function(p){return CPM.norm(p.trangThai).indexOf('hoanthanh')>=0;}).length;
  var paused  = ps.filter(function(p){return CPM.norm(p.trangThai).indexOf('tamngung')>=0;}).length;

  // Tiến độ TB trọng số theo tổng mức đầu tư, lấy từ báo cáo gần nhất
  var wSum=0, wVal=0;
  rows.forEach(function(r){
    if(!r.lastReport) return;
    var w = r.project.tongMucDauTu || 1;
    wSum += w; wVal += w * Math.min(100, Math.max(0, r.lastReport.tienDo));
  });
  var avgProgress = wSum ? wVal/wSum : 0;

  var overdue = rows.filter(function(r){return r.overdue;}).length;
  var mustRep = rows.filter(function(r){return r.mustReport;}).length;
  var onTime  = mustRep ? (mustRep-overdue)/mustRep : 1;

  return '<div class="kpis">' +
    k('Tổng số dự án', ps.length, running+' đang thực hiện · '+done+' hoàn thành · '+paused+' tạm ngưng', C.blue, '📁', null) +
    k('Tổng mức đầu tư', CPM.fmtShort(total), CPM.fmtVND(total)+' đồng', C.purple, '💰', null) +
    k('Đã giải ngân', CPM.fmtShort(paid), CPM.fmtVND(paid)+' đồng', C.green, '💵', null) +
    k('Tỷ lệ giải ngân', (ratio*100).toFixed(1)+'%', 'Còn lại '+CPM.fmtShort(total-paid), ratio>=.6?C.green:ratio>=.3?C.amber:C.red, '📊', ratio) +
    k('Tiến độ thi công TB', avgProgress.toFixed(1)+'%', 'Trọng số theo tổng mức đầu tư', C.cyan, '🏗️', avgProgress/100) +
    k('Trễ báo cáo (>'+CPM.CFG.reportDeadlineDays+' ngày)', overdue, overdue?'Cần nhắc nhở ngay':'Toàn bộ đúng hạn 👍', overdue?C.red:C.green, overdue?'⚠️':'✅', onTime) +
  '</div>';

  function k(lb,vl,sb,color,ic,pct){
    return '<div class="kpi" style="--c:'+color+'"><div class="ic">'+ic+'</div>'+
      '<div class="lb">'+lb+'</div><div class="vl">'+vl+'</div><div class="sb">'+sb+'</div>'+
      (pct!=null?'<div class="bar"><i style="width:'+Math.min(100,Math.max(2,pct*100)).toFixed(1)+'%"></i></div>':'')+
      '</div>';
  }

    late.map(function(r){

// ── Bảng chi tiết dự án ──────────────────────────────
function tableHTML(rows){
  var sorted = rows.slice().sort(function(a,b){
    var va=sortVal(a), vb=sortVal(b);
    if(typeof va==='string') return SORT.dir * va.localeCompare(vb,'vi');
    return SORT.dir * ((va||0)-(vb||0));
  });
  function sortVal(r){
    var p=r.project;
    switch(SORT.key){
      case 'maDA': return p.maDA;
      case 'tenDA': return p.tenDA;
      case 'tongMucDauTu': return p.tongMucDauTu;
      case 'soGiaiNgan': return p.soGiaiNgan;
      case 'tyLeGiaiNgan': return p.tyLeGiaiNgan;
      case 'tienDo': return r.lastReport? r.lastReport.tienDo : -1;
      case 'daysLate': return r.daysLate==null? -1 : r.daysLate;
      case 'trangThai': return p.trangThai;
      default: return p.tyLeGiaiNgan;
    }
  }
  var th = function(key,label,cls){
    var on = SORT.key===key;
    return '<th class="srt '+(cls||'')+'" data-k="'+key+'">'+label+(on?(SORT.dir>0?' ▲':' ▼'):'')+'</th>';
  };
  return '<div class="card" style="margin-top:14px">' +
    '<div class="sec-head"><div><h3 style="margin:0;font-size:15px">📋 Tiến độ chi tiết từng dự án</h3>' +
    '<p class="sub" style="margin:3px 0 0">Nhấn vào một dòng để xem toàn bộ thông tin, nguồn vốn, kế hoạch Gantt và lịch sử báo cáo.</p></div>' +
    '<span class="tag">'+rows.length+' dự án</span></div>' +
    '<div class="tw"><table id="tblProj"><thead><tr>' +
      th('maDA','Mã') + th('tenDA','Tên dự án') + '<th>Phụ trách</th>' +
      th('tongMucDauTu','Tổng mức ĐT','num') + th('soGiaiNgan','Đã giải ngân','num') +
      th('tyLeGiaiNgan','Tỷ lệ GN','ctr') + th('tienDo','Tiến độ TC','ctr') +
      '<th>Giai đoạn</th>' + th('trangThai','Trạng thái') + th('daysLate','Cập nhật BC','ctr') +
    '</tr></thead><tbody>' +
    (sorted.length? sorted.map(rowHTML).join('')
      : '<tr><td colspan="10" class="ctr muted" style="padding:36px">Không có dự án phù hợp bộ lọc</td></tr>') +
    '</tbody></table></div></div>';
}

function rowHTML(r){
  var p=r.project;
  var ratio = Math.max(0, Math.min(1, p.tyLeGiaiNgan));
  var rc = ratio>=.6?C.green:ratio>=.3?C.amber:C.red;
  var prog = r.lastReport? Math.max(0,Math.min(100,r.lastReport.tienDo)) : null;
  var late = r.daysLate;
  var upd = !r.mustReport ? '<span class="muted">—</span>'
    : late==null ? '<span class="pill p-new">Chưa rõ</span>'
    : late>CPM.CFG.reportDeadlineDays ? '<span class="pill p-bad">Trễ '+late+'n</span>'
    : '<span class="pill p-ok">'+late+'n trước</span>';
  return '<tr class="clickable" data-ma="'+CPM.esc(p.maDA)+'">' +
    '<td><span class="muted" style="font-size:12px">'+CPM.esc(p.maDA)+'</span></td>' +
    '<td style="min-width:250px"><b>'+CPM.esc(p.tenDA)+'</b><br><span class="muted" style="font-size:11.5px">'+CPM.esc(p.loaiDA)+' · '+CPM.esc(p.namThucHien)+'</span></td>' +
    '<td style="font-size:12.5px">'+CPM.esc(p.phuTrachKT||'—')+'<br><span class="muted">'+CPM.esc(p.phuTrachKeToan||'')+'</span></td>' +
    '<td class="num">'+CPM.fmtVND(p.tongMucDauTu)+'</td>' +
    '<td class="num">'+CPM.fmtVND(p.soGiaiNgan)+'</td>' +
    '<td class="ctr"><div style="display:flex;align-items:center;gap:7px;justify-content:flex-end">' +
      '<span style="font-weight:700;color:'+rc+'">'+(ratio*100).toFixed(0)+'%</span>' +
      '<div class="mini"><i style="width:'+(ratio*100).toFixed(1)+'%;background:'+rc+'"></i></div></div></td>' +
    '<td class="ctr">'+(prog==null?'<span class="muted">—</span>':
      '<div style="display:flex;align-items:center;gap:7px;justify-content:flex-end"><span style="font-weight:700">'+prog+'%</span>' +
      '<div class="mini"><i style="width:'+prog+'%;background:'+C.cyan+'"></i></div></div>')+'</td>' +
    '<td style="font-size:12.5px">'+CPM.esc(p.giaiDoan||'—')+'</td>' +
    '<td>'+statusPill(p.trangThai)+'</td>' +
    '<td class="ctr">'+upd+'</td></tr>';
}

function statusPill(s){
  var n=CPM.norm(s);
  var c = n.indexOf('dangthuchien')>=0?'p-run' : n.indexOf('hoanthanh')>=0?'p-done'
        : n.indexOf('tamngung')>=0?'p-pause' : 'p-new';
  return '<span class="pill '+c+'">'+CPM.esc(s)+'</span>';
}

// ── Bảng hiệu suất cán bộ ────────────────────────────
function staffHTML(rows){
  var map={};
  rows.forEach(function(r){
    [[r.project.phuTrachKT,'Kỹ thuật'],[r.project.phuTrachKeToan,'Kế toán']].forEach(function(pair){
      if(!pair[0]) return;
      var k=CPM.norm(pair[0]);
      if(!map[k]) map[k]={hoTen:pair[0],vaiTro:{},projects:0,overdue:0,total:0,paid:0,reports:0};
      map[k].vaiTro[pair[1]]=1;
      map[k].projects++;
      map[k].total += r.project.tongMucDauTu;
      map[k].paid  += r.project.soGiaiNgan;
      if(r.overdue) map[k].overdue++;
    });
  });
  // Đếm báo cáo đã nộp theo maNV
  DATA.reports.forEach(function(rp){
    var s = DATA.staff.find(function(x){return x.maNV===rp.maNV;});
    if(!s) return;
    var k=CPM.norm(s.hoTen);
    if(map[k]) map[k].reports++;
  });

  var list=Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){return b.overdue-a.overdue || b.projects-a.projects;});
  if(!list.length) return '';

  return '<div class="card" style="margin-top:14px">' +
    '<h3>👥 Khối lượng công việc & mức độ tuân thủ báo cáo</h3>' +
    '<p class="sub">Theo từng cán bộ được phân công tại cột Phụ trách kỹ thuật / Phụ trách kế toán</p>' +
    '<div class="tw"><table><thead><tr><th>Cán bộ</th><th>Vai trò</th><th class="ctr">Số dự án</th>' +
    '<th class="num">Giá trị quản lý</th><th class="num">Đã giải ngân</th><th class="ctr">Báo cáo đã nộp</th>' +
    '<th class="ctr">Dự án trễ BC</th><th class="ctr">Mức tuân thủ</th></tr></thead><tbody>' +
    list.map(function(s){
      var ok = s.projects? (s.projects-s.overdue)/s.projects : 1;
      var col = ok>=.9?C.green:ok>=.6?C.amber:C.red;
      var st = DATA.staff.find(function(x){return CPM.sameName(x.hoTen,s.hoTen);});
      return '<tr><td><b>'+CPM.esc(s.hoTen)+'</b>'+(st&&st.email?'<br><span class="muted" style="font-size:11.5px">'+CPM.esc(st.email)+'</span>':'')+'</td>'+
        '<td><span class="tag">'+Object.keys(s.vaiTro).join('</span> <span class="tag">')+'</span></td>'+
        '<td class="ctr"><b>'+s.projects+'</b></td>'+
        '<td class="num">'+CPM.fmtVND(s.total)+'</td>'+
        '<td class="num">'+CPM.fmtVND(s.paid)+'</td>'+
        '<td class="ctr">'+s.reports+'</td>'+
        '<td class="ctr">'+(s.overdue?'<span class="pill p-bad">'+s.overdue+'</span>':'<span class="pill p-ok">0</span>')+'</td>'+
        '<td class="ctr"><div style="display:flex;align-items:center;gap:7px;justify-content:flex-end">'+
        '<span style="font-weight:700;color:'+col+'">'+(ok*100).toFixed(0)+'%</span>'+
        '<div class="mini"><i style="width:'+(ok*100)+'%;background:'+col+'"></i></div></div></td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

// ═══════════════════════ BIỂU ĐỒ ═══════════════════════
function kill(id){ if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; } }
var BASE = { responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{ labels:{ font:{family:'Inter',size:11.5}, boxWidth:11, boxHeight:11, usePointStyle:true, padding:12 } } } };

function drawStatus(rows){
  kill('chStatus');
  var m={}; rows.forEach(function(r){ var s=r.project.trangThai||'Chưa xác định'; m[s]=(m[s]||0)+1; });
  var labels=Object.keys(m);
  var colorOf=function(s){var n=CPM.norm(s);
    return n.indexOf('dangthuchien')>=0?C.blue : n.indexOf('hoanthanh')>=0?C.green
         : n.indexOf('tamngung')>=0?C.amber : C.slate;};
  CHARTS.chStatus = new Chart(document.getElementById('chStatus'), {
    type:'doughnut',
    data:{ labels:labels, datasets:[{ data:labels.map(function(l){return m[l];}),
      backgroundColor:labels.map(colorOf), borderWidth:2, borderColor:'#fff' }]},
    options:Object.assign({cutout:'58%'}, BASE, { plugins:{ legend:{position:'bottom',labels:BASE.plugins.legend.labels},
      tooltip:{callbacks:{label:function(c){ var t=c.dataset.data.reduce(function(a,b){return a+b;},0);
        return c.label+': '+c.parsed+' dự án ('+(c.parsed/t*100).toFixed(0)+'%)';}}} } })
  });
}

function drawSource(rows){
  kill('chSource');
  var m={};
  rows.forEach(function(r){ Object.keys(r.project.nguonVon).forEach(function(k){ m[k]=(m[k]||0)+r.project.nguonVon[k]; }); });
  var labels=Object.keys(m).filter(function(k){return m[k]>0;});
  if(!labels.length){ document.getElementById('chSource').parentNode.innerHTML='<div class="loading">Chưa có số liệu nguồn vốn</div>'; return; }

    type:'doughnut',

    options:Object.assign({cutout:'55%'}, BASE, { plugins:{ legend:{position:'bottom',labels:BASE.plugins.legend.labels},
      tooltip:{callbacks:{label:function(c){ var t=c.dataset.data.reduce(function(a,b){return a+b;},0);
        return c.label+': '+CPM.fmtShort(c.parsed)+' ('+(c.parsed/t*100).toFixed(1)+'%)';}}} } })
  });
}

function drawPace(rows){
  kill('chPace');

      scales:{ y:{ beginAtZero:true, position:'left', ticks:{font:{size:11},precision:0}, grid:{color:'#f1f5f9'}, title:{display:true,text:'Số BC/ngày',font:{size:10}} },

  });
}

// ═══════════════════════ DRAWER CHI TIẾT ═══════════════════════
function openProject(maDA){
  var st = STATUS.find(function(s){return s.project.maDA===maDA;});
  if(!st) return;
  var p = st.project;
  var reps = DATA.reports.filter(function(r){return r.maDA===maDA;})
    .sort(function(a,b){return (b.ngay?b.ngay.getTime():0)-(a.ngay?a.ngay.getTime():0);});
  var tasks = DATA.gantt.filter(function(g){return g.maDA===maDA;});

  document.getElementById('drTitle').textContent = p.tenDA;
  document.getElementById('drSub').innerHTML =
    '#'+CPM.esc(p.maDA)+' · '+CPM.esc(p.loaiDA)+' · Năm '+CPM.esc(p.namThucHien)+' · '+statusPill(p.trangThai);

  var ratio=Math.max(0,Math.min(1,p.tyLeGiaiNgan));
  var prog = st.lastReport? st.lastReport.tienDo : 0;
  var srcRows = Object.keys(p.nguonVon).filter(function(k){return p.nguonVon[k]>0;});

  var html =
    (p.moTa? '<p style="font-size:13.5px;line-height:1.65;background:#f8fafc;padding:12px 14px;border-radius:10px;margin:0 0 16px">'+CPM.esc(p.moTa)+'</p>':'') +
    '<div class="dl">' +
      dt('Tổng mức đầu tư', CPM.fmtVND(p.tongMucDauTu)+' đ') +
      dt('Đã giải ngân', CPM.fmtVND(p.soGiaiNgan)+' đ') +
      dt('Tỷ lệ giải ngân', (ratio*100).toFixed(1)+'%') +
      dt('Tiến độ thi công', prog+'%') +
      dt('Giai đoạn hiện tại', p.giaiDoan||'—') +
      dt('Thời gian', CPM.fmtDate(p.ngayBatDau)+' → '+CPM.fmtDate(p.ngayKetThuc)) +
      dt('Phụ trách kỹ thuật', p.phuTrachKT||'—') +
      dt('Phụ trách kế toán', p.phuTrachKeToan||'—') +
    '</div>' +

    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px">' +
      prBox('Giải ngân', ratio, ratio>=.6?C.green:ratio>=.3?C.amber:C.red) +
      prBox('Thi công', prog/100, C.cyan) +
    '</div>' +

    (srcRows.length? '<h4 class="blk">Cơ cấu nguồn vốn bố trí</h4><div class="tw" style="max-height:none"><table><tbody>' +
      srcRows.map(function(k){
        var v=p.nguonVon[k], tot=srcRows.reduce(function(a,x){return a+p.nguonVon[x];},0);
        return '<tr><td>'+k+'</td><td class="num"><b>'+CPM.fmtVND(v)+' đ</b></td>'+
          '<td class="num muted" style="width:70px">'+(v/tot*100).toFixed(1)+'%</td></tr>';

var MAIL = { txt:'', html:'', to:'', subject:'' };

function buildMail(groups){
  var d = CPM.fmtDate(TODAY);
  var multi = groups.length > 1;
  var to = groups.map(function(g){return g.email;}).filter(Boolean).join(', ');
  var subject = multi
    ? '[NHẮC NHỞ] Cập nhật báo cáo tiến độ dự án đầu tư công — ngày ' + d
    : '[NHẮC NHỞ] ' + groups[0].hoTen + ' — cập nhật báo cáo tiến độ dự án đầu tư công';

  var txt = '', html = '';
  groups.forEach(function(g, gi){
    if(gi) { txt += '\n\n' + '='.repeat(70) + '\n\n'; }
    txt += mailText(g, d);
  });
  html = mailHTML(groups, d);
  MAIL = { txt:txt, html:html, to:to, subject:subject };
  return MAIL;
}

function exportCSV(){
  var rows = filtered();
  var head = ['Mã DA','Tên dự án','Loại','Năm','Trạng thái','Giai đoạn','Phụ trách KT','Phụ trách KT-KT',
    'Tổng mức đầu tư','Đã giải ngân','Tỷ lệ giải ngân (%)','Tiến độ TC (%)','Báo cáo gần nhất','Số ngày từ BC gần nhất','Trễ hạn'];
  var lines = [head.join(';')];
  rows.forEach(function(r){
    var p=r.project;
    lines.push([
      p.maDA, q(p.tenDA), q(p.loaiDA), p.namThucHien, q(p.trangThai), q(p.giaiDoan),
      q(p.phuTrachKT), q(p.phuTrachKeToan),
      Math.round(p.tongMucDauTu), Math.round(p.soGiaiNgan), (p.tyLeGiaiNgan*100).toFixed(1),
      r.lastReport? r.lastReport.tienDo : '', r.lastDate? CPM.fmtDate(r.lastDate):'',
      r.daysLate==null?'':r.daysLate, r.overdue?'TRỄ':''
    ].join(';'));
  });
  function q(s){ s=String(s==null?'':s); return /[;"\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
  var blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DauTuCong_TanPhu_' + CPM.toISO(TODAY) + '.csv';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

  navigator.clipboard.writeText(text).then(function(){
    var b=document.getElementById('btnCopy'); var o=b.textContent;
    b.textContent='✅ Đã sao chép'; setTimeout(function(){ b.textContent=o; },1600);
  });
};
document.getElementById('btnMailto').onclick = function(){
  window.location.href = 'mailto:' + encodeURIComponent(MAIL.to) +
    '?subject=' + encodeURIComponent(MAIL.subject) + '&body=' + encodeURIComponent(MAIL.txt);
};
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeDrawer(); document.getElementById('mail').classList.remove('on'); }
});

boot(true);
</script>
